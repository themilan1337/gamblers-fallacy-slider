[project]
name = "gfmodel"
version = "0.1.0"
description = "Reference implementation of the Bayesian gambler's-fallacy model in Dorst (2026), with a JavaScript port and a static page."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "playwright==1.56.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gfmodel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slower tests (numpy Monte Carlo, browser)"]
